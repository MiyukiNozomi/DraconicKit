<div class="api-reference-side">
  <h2>API REFERENCE</h2>
  <div class="tocline">
    <img class="left" src="/res/scrollbar-up.webp" />
    <img class="center" src="/res/draconic-kit-favicon.webp" />
    <img class="right" src="/res/scrollbar-down.webp" />

    <div class="middleline"></div>
  </div>
  <script lang="hx">
        var classList = builder.getBuilderProps().classList;
        var tree = {};


        for (key => value in Reflect.iterator(classList)) {
            var path = key.split('.');
            var root = tree;

            for (segment in path) {
                if (Reflect.getProperty(root, segment) == null)
                    Reflect.setProperty(root, segment, {});

                root = Reflect.getProperty(root, segment);
            }

            for (elm in value) {
                Reflect.setProperty(root, elm, {});
            }
        }

    function renderTree(node, path, isRoot) {
        var nodeValues = Reflect.fields(node).map(function(name) {
            return {
                name: name,
                obj: Reflect.getProperty(node, name)
            };
        });

        // Sort namespaces before leaf entries
        nodeValues.sort(function(a, b) {
            var aIsLeaf = Reflect.fields(a.obj).length == 0;
            var bIsLeaf = Reflect.fields(b.obj).length == 0;

            if (aIsLeaf == bIsLeaf) {
                return 0;
            }

            return aIsLeaf ? 1 : -1;
        });

        return {
            name: "ul",
            childNodes: nodeValues.map(function(v) {
                var currentPath = path == ""
                    ? v.name
                    : path + "." + v.name;

                if (Reflect.fields(v.obj) != 0) {
                    return {
                        name: "li",
                        childNodes: [
                            {
                                name: "details",
                                attributes: {
                                    open: isRoot ? "" : null
                                },
                                childNodes: [
                                    {
                                        name: "summary",
                                        childNodes: [v.name]
                                    },
                                    renderTree(v.obj, currentPath, false)
                                ]
                            }
                        ]
                    };
                }

                return {
                    name: "li",
                    childNodes: [
                        {
                            name: "a",
                            attributes: {
                                href: "/apiref/" + currentPath.split(".").join("/") + ".html"
                            },
                            childNodes: [v.name]
                        }
                    ]
                };
            })
        };
    }


        builder.render(builder.elementOf(renderTree(tree, "", true)));
  </script>
</div>
