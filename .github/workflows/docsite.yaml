name: build

on:
  push:
    paths:
      - docsite/**
      - .github/workflows/docsite.yaml
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: latest

      - name: Build
        shell: bash
        run: |
          cd docsite/

          haxelib install markdown
          haxelib install hscript
          haxe build.hxml && java -jar bin/DocBuilder.jar build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: page-html
          path: docsite/bin/static
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: page-html
